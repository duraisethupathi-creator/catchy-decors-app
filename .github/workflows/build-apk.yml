name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "android/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "babel.config.js"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install JavaScript dependencies
        run: npm install
      - name: Generate Android native project
        run: npx expo prebuild --clean --platform android --no-install
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Show Android signing fingerprint
        run: npm run android:fingerprint
      - name: Show signing certificate SHA-1
        working-directory: android
        run: ./gradlew signingReport --no-daemon
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify actual release APK identity
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          echo "=== APK PACKAGE ==="
          "$AAPT" dump badging "$APK" | head -1
          echo "=== APK SIGNING CERTIFICATE ==="
          "$APKSIGNER" verify --print-certs "$APK"
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Catchy-Decors.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Catchy-Decors-APK
          path: Catchy-Decors.apk
          if-no-files-found: error
          retention-days: 30
