name: Build Windows Web App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - ".github/workflows/build-web.yml"

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Export browser app
        run: npm run web:build
      - name: Upload web app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Catchy-Decors-Windows-Web
          path: dist/
          if-no-files-found: error
          retention-days: 30
